name = "goti-contact"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public settings. Secrets are NOT stored here; set them with `wrangler secret put` (see README.md):
#   SMTP_PASS, MAIL_TO, MAIL_CC
[vars]
SMTP_HOST = "smtp.titan.email"
SMTP_PORT = "465"
SMTP_USER = "contact@gotiadarian.com"
ALLOWED_ORIGIN = "https://gotiadarian.com"
THANKS_URL = "https://gotiadarian.com/contact/thanks/"
CONTACT_URL = "https://gotiadarian.com/contact/"

# Rate limiting by IP (5 messages per hour). Namespace created with `wrangler kv namespace create RATE`.
[[kv_namespaces]]
binding = "RATE"
id = "deb7cf8eb3f842858df1e09f078c6850"
